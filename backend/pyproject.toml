[project]
name = "quantum-agis-backend"
version = "1.0.0"
description = "Quantum-inspired Agentic Governance & Intrusion Shield — backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "qutip>=5.1.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "httpx>=0.26.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
